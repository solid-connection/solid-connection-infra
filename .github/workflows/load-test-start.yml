name: Load Test Start

on:
  workflow_dispatch:
    inputs:
      load_test_db_instance_type:
        description: "Load-test MySQL EC2 instance type (required; no default)"
        required: true
        type: string
      switch_stage_to_loadtest:
        description: "Restart stage app with dev,loadtest profiles"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: load-test-environment
  cancel-in-progress: false

env:
  TF_VERSION: "1.10.5"

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LOAD_TEST_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Start load test environment
        env:
          DB_INSTANCE_TYPE: ${{ inputs.load_test_db_instance_type }}
        run: |
          if [ -z "$DB_INSTANCE_TYPE" ]; then
            echo "load_test_db_instance_type is required" >&2
            exit 1
          fi

          export TF_VAR_load_generator_instance_type="c7i.large"
          export TF_VAR_create_load_generator="false"

          if [ -n "${{ vars.LOAD_GENERATOR_INSTANCE_PROFILE_NAME }}" ]; then
            export TF_VAR_load_generator_instance_profile_name="${{ vars.LOAD_GENERATOR_INSTANCE_PROFILE_NAME }}"
          fi

          args=(--db-instance-type "$DB_INSTANCE_TYPE")

          if [ "${{ inputs.switch_stage_to_loadtest }}" = "true" ]; then
            args+=(--switch-stage-to-loadtest)
          fi

          bash scripts/load_test/start.sh "${args[@]}"

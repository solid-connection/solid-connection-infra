          fi
          cat plan_policy.txt plan_intent.txt
          exit "$rc"
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-global
          path: environment/global/plan_output.txt
      - name: Post Plan Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:global -->';
            const planFile = 'environment/global/plan_output.txt';
            const readIfExists = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const changes = readIfExists('environment/global/plan_changes.md');
            const policy = readIfExists('environment/global/plan_policy.txt');
            const intent = readIfExists('environment/global/plan_intent.txt');
            const intentResult = fs.existsSync('environment/global/plan_intent.txt') ? (intent ? `❌ 실패\n\n\`\`\`\n${intent}\n\`\`\`` : '✅ 일치') : '';
            const intentSection = intentResult ? `**의도 대조** (PR 본문 \`verify-expect\`): ${intentResult}\n\n` : '';
            const changesSection = changes ? `${changes}\n\n` : '';
            const policySection = policy ? `**정책 검사**\n\n\`\`\`\n${policy}\n\`\`\`\n\n` : '';
            const output = fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : '';
            const summary = output.split('\n').find(l => /^Plan:/.test(l)) || output.split('\n').find(l => /No changes/.test(l)) || (output ? '(결과 파싱 불가)' : '⚠️ plan 실행 전 단계에서 실패했습니다. 워크플로우 로그를 확인하세요.');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Terraform Plan: \`global\`\n\n${summary}\n\n${changesSection}${policySection}${intentSection}> 전체 plan 결과는 보안을 위해 댓글에 포함되지 않습니다. [워크플로우 실행 아티팩트](${runUrl})를 확인하세요.`;

            const { data: comments } = await github.rest.issues.listComments({

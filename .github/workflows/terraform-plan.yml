name: Terraform Plan

on:
  pull_request:
    branches: [main]
    # edited: PR 본문의 verify-expect(의도) 블록을 고치면 의도 대조를 다시 실행한다.
    types: [opened, synchronize, reopened, edited]

# 같은 PR 의 plan 이 겹쳐 state lock 이 충돌하지 않게 한다.
# 실행 중인 plan 을 강제 종료하면 S3 .tflock 이 남을 수 있으므로 취소하지 않고, 대기 중인 실행만 최신 것으로 교체한다.
# (의도 대조는 실행 시점의 PR 본문을 조회하므로 어떤 실행이 남아도 최신 의도로 검사한다)
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.5"
  SSM_TUNNEL_TIMEOUT: "60"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
      global: ${{ steps.filter.outputs.global }}
      prod: ${{ steps.filter.outputs.prod }}
      stage: ${{ steps.filter.outputs.stage }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      load_test: ${{ steps.filter.outputs.load_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bootstrap:
              - 'bootstrap/**'
            global:
              - 'environment/global/**'
              - 'modules/shared_resources/**'
              - 'config/secrets'
            prod:
              - 'environment/prod/**'
              - 'modules/app_stack/**'
              - 'modules/common/**'
              - 'config/side-infra/**'
              - 'config/secrets'
            stage:
              - 'environment/stage/**'
              - 'modules/app_stack/**'
              - 'modules/common/**'
              - 'config/side-infra/**'
              - 'config/secrets'
            monitoring:
              - 'environment/monitoring/**'
              - 'modules/monitoring_stack/**'
              - 'modules/common/**'
              - 'config/secrets'
            load_test:
              - 'environment/load_test/**'
              - 'modules/app_stack/templates/**'
              - 'config/secrets'

  plan-bootstrap:
    needs: detect-changes
    if: needs.detect-changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: bootstrap
        run: terraform init
      - name: Terraform Plan
        id: plan
        working-directory: bootstrap
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Check Plan (L2)
        if: steps.plan.outputs.exitcode == '0'
        working-directory: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          check="$GITHUB_WORKSPACE/scripts/verify/plan_check.py"
          rc=0
          terraform show -json tfplan > plan.json
          python3 "$check" summary plan.json --markdown > plan_changes.md
          python3 "$check" policy plan.json > plan_policy.txt || rc=1
          # 의도는 이벤트 payload 가 아니라 실행 시점의 PR 본문에서 읽는다. (push 직후 본문 수정 등 실행이 겹쳐도 최신 의도로 대조)
          # PR 본문은 신뢰할 수 없는 입력이므로 셸 코드에 넣지 않고 변수/환경 변수로만 다룬다.
          # stderr(형식 오류 등)도 결과 파일에 남겨, job 실패가 PR 댓글에 "일치"로 보이지 않게 한다.
          if ! PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"; then
            echo "    PR 본문 조회 실패" > plan_intent.txt
            rc=1
          elif PR_BODY="$PR_BODY" python3 "$check" extract-expect --out expect.txt > plan_intent.txt 2>&1; then
            python3 "$check" expect plan.json --env bootstrap --expect expect.txt --redact > plan_intent.txt 2>&1 || rc=1
          else
            rc=1
          fi
          cat plan_policy.txt plan_intent.txt
          exit "$rc"
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-bootstrap
          path: bootstrap/plan_output.txt
      - name: Post Plan Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:bootstrap -->';
            const planFile = 'bootstrap/plan_output.txt';
            const readIfExists = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const changes = readIfExists('bootstrap/plan_changes.md');
            const policy = readIfExists('bootstrap/plan_policy.txt');
            const intent = readIfExists('bootstrap/plan_intent.txt');
            const intentResult = fs.existsSync('bootstrap/plan_intent.txt') ? (intent ? `❌ 실패\n\n\`\`\`\n${intent}\n\`\`\`` : '✅ 일치') : '';
            const intentSection = intentResult ? `**의도 대조** (PR 본문 \`verify-expect\`): ${intentResult}\n\n` : '';
            const changesSection = changes ? `${changes}\n\n` : '';
            const policySection = policy ? `**정책 검사**\n\n\`\`\`\n${policy}\n\`\`\`\n\n` : '';
            const output = fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : '';
            const summary = output.split('\n').find(l => /^Plan:/.test(l)) || output.split('\n').find(l => /No changes/.test(l)) || (output ? '(결과 파싱 불가)' : '⚠️ plan 실행 전 단계에서 실패했습니다. 워크플로우 로그를 확인하세요.');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Terraform Plan: \`bootstrap\`\n\n${summary}\n\n${changesSection}${policySection}${intentSection}> 전체 plan 결과는 보안을 위해 댓글에 포함되지 않습니다. [워크플로우 실행 아티팩트](${runUrl})를 확인하세요.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
            }
      - name: Plan Status Check
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  plan-global:
    needs: detect-changes
    if: needs.detect-changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: environment/global
        run: terraform init
      - name: Terraform Plan
        id: plan
        working-directory: environment/global
        run: |
          terraform plan -no-color -out=tfplan \
            -var-file="../../config/secrets/shared_resources.tfvars" \
            2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Check Plan (L2)
        if: steps.plan.outputs.exitcode == '0'
        working-directory: environment/global
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          check="$GITHUB_WORKSPACE/scripts/verify/plan_check.py"
          rc=0
          terraform show -json tfplan > plan.json
          python3 "$check" summary plan.json --markdown > plan_changes.md
          python3 "$check" policy plan.json > plan_policy.txt || rc=1

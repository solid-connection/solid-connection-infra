          terraform show -json tfplan > plan.json
          python3 "$check" summary plan.json --markdown > plan_changes.md
          python3 "$check" policy plan.json > plan_policy.txt || rc=1
          # 의도는 이벤트 payload 가 아니라 실행 시점의 PR 본문에서 읽는다. (push 직후 본문 수정 등 실행이 겹쳐도 최신 의도로 대조)
          # PR 본문은 신뢰할 수 없는 입력이므로 셸 코드에 넣지 않고 변수/환경 변수로만 다룬다.
          # stderr(형식 오류 등)도 결과 파일에 남겨, job 실패가 PR 댓글에 "일치"로 보이지 않게 한다.
          if ! PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"; then
            echo "    PR 본문 조회 실패" > plan_intent.txt
            rc=1
          elif PR_BODY="$PR_BODY" python3 "$check" extract-expect --out expect.txt > plan_intent.txt 2>&1; then
            python3 "$check" expect plan.json --env stage --expect expect.txt --redact > plan_intent.txt 2>&1 || rc=1
          else
            rc=1
          fi
          cat plan_policy.txt plan_intent.txt
          exit "$rc"
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-stage
          path: environment/stage/plan_output.txt
      - name: Post Plan Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:stage -->';
            const planFile = 'environment/stage/plan_output.txt';
            const readIfExists = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const changes = readIfExists('environment/stage/plan_changes.md');
            const policy = readIfExists('environment/stage/plan_policy.txt');
            const intent = readIfExists('environment/stage/plan_intent.txt');
            const intentResult = fs.existsSync('environment/stage/plan_intent.txt') ? (intent ? `❌ 실패\n\n\`\`\`\n${intent}\n\`\`\`` : '✅ 일치') : '';
            const intentSection = intentResult ? `**의도 대조** (PR 본문 \`verify-expect\`): ${intentResult}\n\n` : '';
            const changesSection = changes ? `${changes}\n\n` : '';
            const policySection = policy ? `**정책 검사**\n\n\`\`\`\n${policy}\n\`\`\`\n\n` : '';
            const output = fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : '';
            const summary = output.split('\n').find(l => /^Plan:/.test(l)) || output.split('\n').find(l => /No changes/.test(l)) || (output ? '(결과 파싱 불가)' : '⚠️ plan 실행 전 단계에서 실패했습니다. 워크플로우 로그를 확인하세요.');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Terraform Plan: \`stage\`\n\n${summary}\n\n${changesSection}${policySection}${intentSection}> 전체 plan 결과는 보안을 위해 댓글에 포함되지 않습니다. [워크플로우 실행 아티팩트](${runUrl})를 확인하세요.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
            }
      - name: Plan Status Check
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1


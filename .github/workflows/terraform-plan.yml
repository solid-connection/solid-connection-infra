        run: exit 1

  plan-prod:
    needs: detect-changes
    if: needs.detect-changes.outputs.prod == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Install Session Manager Plugin
        run: |
          curl -sL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          # 이후 모든 스텝의 PATH 맨 앞에 신규 설치 경로 추가
          echo "/usr/local/sessionmanagerplugin/bin" >> $GITHUB_PATH
          /usr/local/sessionmanagerplugin/bin/session-manager-plugin --version
      - name: Start SSM Tunnel to DB EC2
        run: |
          echo "=== session-manager-plugin 진단 ==="
          which session-manager-plugin || echo "NOT IN PATH"
          session-manager-plugin --version || echo "VERSION CHECK FAILED"
          echo "===================================="

          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=solid-connection-server-prod" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          DB_EC2_HOST=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=solid-connection-db-mysql-prod" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' \
            --output text)

          if [ -z "$EC2_ID" ] || [ "$EC2_ID" = "None" ]; then
            echo "::error::prod EC2 인스턴스를 찾을 수 없습니다"
            exit 1
          fi
          if [ -z "$DB_EC2_HOST" ] || [ "$DB_EC2_HOST" = "None" ]; then
            echo "::error::prod DB EC2 private IP를 찾을 수 없습니다"
            exit 1
          fi

          echo "Tunneling via $EC2_ID -> $DB_EC2_HOST:3306"

          aws ssm start-session \
            --target "$EC2_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$DB_EC2_HOST\"],\"portNumber\":[\"3306\"],\"localPortNumber\":[\"3306\"]}" &
          SSM_PID=$!
          echo "SSM_PID=$SSM_PID" >> $GITHUB_ENV

          for i in $(seq 1 $SSM_TUNNEL_TIMEOUT); do
            if ! kill -0 $SSM_PID 2>/dev/null; then
              echo "::error::SSM 세션이 터널 준비 전에 종료되었습니다"
              exit 1
            fi
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "SSM tunnel ready (${i}s)"
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 3306 2>/dev/null; then
            echo "::error::${SSM_TUNNEL_TIMEOUT}초 내에 터널이 준비되지 않았습니다"
            kill $SSM_PID 2>/dev/null || true
            exit 1
          fi
          if ! kill -0 $SSM_PID 2>/dev/null; then
            echo "::error::포트는 열렸으나 SSM 세션이 이미 종료되었습니다"
            exit 1
          fi
      - name: Terraform Init
        working-directory: environment/prod
        run: terraform init
      - name: Terraform Plan
        id: plan
        working-directory: environment/prod
        run: |
          terraform plan -no-color -out=tfplan \
            -var-file="../../config/secrets/prod.tfvars" \
            -var-file="../../config/secrets/prod_db.tfvars" \
            -var-file="../../config/secrets/app_stack.tfvars" \
            2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Stop SSM Tunnel
        if: always()
        run: kill $SSM_PID 2>/dev/null || true
      - name: Check Plan (L2)
        if: steps.plan.outputs.exitcode == '0'
        working-directory: environment/prod
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          check="$GITHUB_WORKSPACE/scripts/verify/plan_check.py"
          rc=0
          terraform show -json tfplan > plan.json
          python3 "$check" summary plan.json --markdown > plan_changes.md
          python3 "$check" policy plan.json > plan_policy.txt || rc=1
          # 의도는 이벤트 payload 가 아니라 실행 시점의 PR 본문에서 읽는다. (push 직후 본문 수정 등 실행이 겹쳐도 최신 의도로 대조)
          # PR 본문은 신뢰할 수 없는 입력이므로 셸 코드에 넣지 않고 변수/환경 변수로만 다룬다.
          # stderr(형식 오류 등)도 결과 파일에 남겨, job 실패가 PR 댓글에 "일치"로 보이지 않게 한다.
          if ! PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"; then
            echo "    PR 본문 조회 실패" > plan_intent.txt
            rc=1
          elif PR_BODY="$PR_BODY" python3 "$check" extract-expect --out expect.txt > plan_intent.txt 2>&1; then
            python3 "$check" expect plan.json --env prod --expect expect.txt --redact > plan_intent.txt 2>&1 || rc=1
          else
            rc=1
          fi
          cat plan_policy.txt plan_intent.txt
          exit "$rc"
      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod
          path: environment/prod/plan_output.txt
      - name: Post Plan Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:prod -->';
            const planFile = 'environment/prod/plan_output.txt';
            const readIfExists = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').trim() : '';
            const changes = readIfExists('environment/prod/plan_changes.md');
            const policy = readIfExists('environment/prod/plan_policy.txt');
            const intent = readIfExists('environment/prod/plan_intent.txt');
            const intentResult = fs.existsSync('environment/prod/plan_intent.txt') ? (intent ? `❌ 실패\n\n\`\`\`\n${intent}\n\`\`\`` : '✅ 일치') : '';
            const intentSection = intentResult ? `**의도 대조** (PR 본문 \`verify-expect\`): ${intentResult}\n\n` : '';
            const changesSection = changes ? `${changes}\n\n` : '';
            const policySection = policy ? `**정책 검사**\n\n\`\`\`\n${policy}\n\`\`\`\n\n` : '';
            const output = fs.existsSync(planFile) ? fs.readFileSync(planFile, 'utf8') : '';
            const summary = output.split('\n').find(l => /^Plan:/.test(l)) || output.split('\n').find(l => /No changes/.test(l)) || (output ? '(결과 파싱 불가)' : '⚠️ plan 실행 전 단계에서 실패했습니다. 워크플로우 로그를 확인하세요.');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Terraform Plan: \`prod\`\n\n${summary}\n\n${changesSection}${policySection}${intentSection}> 전체 plan 결과는 보안을 위해 댓글에 포함되지 않습니다. [워크플로우 실행 아티팩트](${runUrl})를 확인하세요.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
            }
      - name: Plan Status Check
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  plan-stage:
    needs: detect-changes
    if: needs.detect-changes.outputs.stage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
